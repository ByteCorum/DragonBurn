name: release beta

on:
  push:
    branches: [stable, WIP]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Send release to discord
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"embeds\":[{\"title\":\"🚀 Deployment Successful!\",\"description\":\"Code deployed to production\",\"color\":65280,\"fields\":[{\"name\":\"📦 Repository\",\"value\":\"$REPO\",\"inline\":true},{\"name\":\"🌿 Branch\",\"value\":\"$BRANCH\",\"inline\":true},{\"name\":\"👤 Author\",\"value\":\"$AUTHOR\",\"inline\":true},{\"name\":\"💾 Commit\",\"value\":\"[\`${SHA:0:7}\`](https://github.com/$REPO/commit/$SHA)\",\"inline\":false}],\"thumbnail\":{\"url\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"},\"footer\":{\"text\":\"GitHub Actions\",\"icon_url\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"}]}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"