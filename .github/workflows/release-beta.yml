name: release beta

on:
  push:
    branches: [stable, WIP]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Send release to discord
        run: |
          curl -H 'Content-Type: multipart/form-data' \
          -X POST \
          -F "payload_json={\"content\": \"**${{ github.repository }}**\nCommit: ${{ github.event.head_commit.message }}[`${{ github.sha }}`]\"}" \
          -F "file="D:\a\DragonBurn\DragonBurn\built\DragonBurn.exe"; filename=\"DragonBurn-${{ github.sha }}\"" ${{ secrets.WEBHOOK_URL }}
