name: release beta

on:
  push:
    branches: [stable, WIP]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Send release to discord
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          --data-binary "{\"embeds\":[{\"title\":\"DragonBurn\",\"description\":\"Beta-release build\",\"fields\":[{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":false},{\"name\":\"Commit name\",\"value\":\"${{ github.event.head_commit.message }}\",\"inline\":true},{\"name\":\"Commit sha\",\"value\":\"${{ github.sha }}\",\"inline\":true},{\"name\":\"Binaries\",\"value\":\"---\",\"inline\":false}],\"color\":4608371,\"footer\":{\"text\":\"DragonBurn community\",\"icon_url\":\"https://github.com/ByteCorum/DragonBurn/blob/stable/Assets/logo_square.png?raw=true\"},\"thumbnail\":{\"url\":\"https://github.com/ByteCorum/DragonBurn/blob/stable/Assets/logo_square.png?raw=true\"}}]}" \
          "https://discord.com/api/webhooks/1410693136350445761/fKgyRei6RikVvf8pdV5KXCoFRrWGApK6UewuXtvWiH2wHimrihHNOS2YvPVug1WIRn65"
