name: cmake-build-check x64 release

on:
  push:
    branches: [stable, wip_maintenance]
  pull_request:
    branches: [stable, wip_maintenance]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@vlatest

      - name: Configure CMake
        shell: cmd
        run: cmake -B build -A x64 -DCMAKE_CONFIGURATION_TYPES=Release -DDRAGONBURN_BUILD_KERNEL=ON -DDRAGONBURN_BUILD_USERMODE=ON

      - name: Build with CMake
        shell: cmd
        run: cmake --build build --config Release -- /m

      - name: Verify build outputs
        shell: pwsh
        run: |
          $expected = @(
            'built\DragonBurn-usermode.exe',
            'built\DragonBurn-kernel.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              Write-Error "Build output missing: $file"
              exit 1
            }
            Write-Host "OK: $file"
          }

      - name: Archive build
        uses: actions/upload-artifact@latest
        with:
          name: DragonBurn_cmake_${{ github.sha }}
          path: |
            built/DragonBurn-usermode.exe
            built/DragonBurn-kernel.exe
